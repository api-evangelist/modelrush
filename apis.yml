name: ModelRush
description: A multilingual multimodal AI API platform (text, image, video, speech) serving a hosted model catalog
  -- open-weight families (DeepSeek, GLM, CosyVoice, Fun-ASR) alongside grok-family entries -- behind one bearer
  key with a public keyless model inventory and per-model regional pricing.
